name: 自动部署Vue3项目到阿里云轻量服务器

on:
  push:
    branches:
      - main # 提交到main分支自动部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 安装依赖
        run: npm install

      - name: 打包Vue项目
        run: npm run build

      - name: 上传到服务器
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.REMOTE_DIR }}/
          port: ${{ secrets.PORT }}
          dangerous-clean-slate: false # 不删除服务器原有文件（更安全）
